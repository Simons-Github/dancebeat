name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache MediaPipe models
        uses: actions/cache@v4
        with:
          path: public/mediapipe/models
          key: mediapipe-models-${{ hashFiles('scripts/models.ts') }}

      - run: bun install --frozen-lockfile
      - run: bun run fetch-models
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
